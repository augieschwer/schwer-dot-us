name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Web Server
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Copy index.html to web directory
        run: |
          cp index.html /var/www/html/schwer.us/
          echo "Deployment completed successfully"

